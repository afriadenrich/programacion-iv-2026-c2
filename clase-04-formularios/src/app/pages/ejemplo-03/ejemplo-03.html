<h2>Ejemplo 02</h2>

<form [formGroup]="formulario" (ngSubmit)="enviar()">
  <div>
    <app-campo-input id="nombre" [control]="formulario.controls.nombre" label="Nombre">
      <app-error-required [errors]="formulario.controls.nombre.errors"></app-error-required>
      <app-error-min-length [errors]="formulario.controls.nombre.errors"></app-error-min-length>
    </app-campo-input>

    <app-campo-input id="apellido" [control]="formulario.controls.apellido" label="Apellido">
    </app-campo-input>

    <app-campo-input
      id="email"
      [control]="formulario.controls.email"
      label="Email"
    ></app-campo-input>
  </div>
  <div id="direccion" formGroupName="direccion">
    <app-campo-input
      id="calle"
      [control]="formulario.controls.direccion.controls.calle"
      label="Calle"
    ></app-campo-input>

    <app-campo-input
      id="numeroDir"
      [control]="formulario.controls.direccion.controls.numero"
      label="Numero"
    ></app-campo-input>
  </div>
  <div id="tarjeta" formGroupName="tarjeta">
    <h3>Tarjeta:</h3>
    <app-campo-input
      id="numeroTar"
      [control]="formulario.controls.tarjeta.controls.numero"
      label="Numero"
    ></app-campo-input>

    <app-campo-input
      id="vencimientoMes"
      [control]="formulario.controls.tarjeta.controls.vencimientoMes"
      label="Mes"
    ></app-campo-input>

    <app-campo-input
      id="vencimientoAnio"
      [control]="formulario.controls.tarjeta.controls.vencimientoAnio"
      label="Anio"
    ></app-campo-input>

    <app-campo-input
      id="codigo"
      [control]="formulario.controls.tarjeta.controls.codigo"
      label="Código"
    ></app-campo-input>
  </div>
  <div>
    <button type="submit">Enviar</button>
  </div>
</form>
